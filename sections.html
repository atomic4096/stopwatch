<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>セクション一覧</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- PWA設定（index.html と同じ） -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="apple-touch-startup-image" href="assets/splash-640x1136.png" media="(device-width: 320px)">
<link rel="apple-touch-startup-image" href="assets/splash-750x1334.png" media="(device-width: 375px)">
<link rel="apple-touch-startup-image" href="assets/splash-1125x2436.png" media="(device-width: 414px)">

<style>
  body {
    background:#000;
    color:#fff;
    font-family:sans-serif;
    margin:0;
    padding:12px 8px 80px;
  }
  h2 { margin:8px; }

  .section {
    background:#111;
    border:1px solid #333;
    border-radius:8px;
    padding:10px;
    margin-bottom:10px;
  }

  .header {
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:6px;
  }

  .lap-row { font-size:16px; margin:4px 0; }

  .summary {
    margin-top:8px;
    padding-top:6px;
    border-top:1px dashed #444;
    font-size:14px;
  }

  select {
    font-size:14px;
    padding:2px 4px;
    margin-left:6px;
  }

  .deleteBtn {
    background:#dc3545;
    color:#fff;
    padding:6px 10px;
    border:none;
    border-radius:6px;
    margin-top:10px;
  }

  .bottom-bar {
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    background:#111;
    border-top:1px solid #333;
    padding:8px 4px;
    display:flex;
    gap:4px;
    box-sizing:border-box;
  }
  .bottom-bar button {
    flex:1;
    padding:10px 0;
    font-size:16px;
    border:none;
    border-radius:6px;
    color:#fff;
  }
  #backBtn { background:#17a2b8; }
  #csvBtn { background:#fd7e14; }
</style>
</head>
