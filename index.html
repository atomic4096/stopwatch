<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Section Stopwatch</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    background: #000;
    color: #fff;
    font-family: sans-serif;
    margin: 0;
    padding-bottom: 120px;
  }
  #time {
    font-size: 70px;
    text-align: center;
    margin: 20px 0;
  }
  .section {
    background: #111;
    margin: 12px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #333;
  }
  .lap-row {
    margin: 6px 0;
  }
  select {
    font-size: 16px;
    padding: 4px;
    margin-left: 10px;
  }
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #111;
    padding: 10px 0;
    border-top: 1px solid #333;
    display: flex;
    justify-content: space-around;
  }
  .bottom-bar button {
    flex: 1;
    margin: 0 4px;
    padding: 14px 0;
    font-size: 20px;
    border: none;
    border-radius: 6px;
    color: #fff;
  }
  #mainBtn { background: #28a745; }
  #resetBtn { background: #6c757d; }
  #csvBtn { background: #fd7e14; }
  #nameBtn { background: #17a2b8; }
</style>
</head>
<body>

<div id="time">00:00.00</div>

<div id="sections"></div>

<div class="bottom-bar">
  <button id="mainBtn" onclick="toggleStartStop()">Start</button>
  <button id="resetBtn" onclick="resetAll()">Reset</button>
  <button id="csvBtn" onclick="downloadCSV()">CSV</button>
  <button id="nameBtn" onclick="location.href='names.html'">名前管理</button>
</div>

<script>
let timer = null;
let startTime = 0;
let elapsed = 0;
let sections = JSON.parse(localStorage.getItem("sections") || "[]");
let names = JSON.parse(localStorage.getItem("peopleList") || "[]");
let currentSection = null;

function updateDisplay(ms) {
  const m = Math.floor(ms / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  const ms2 = Math.floor((ms % 1000) / 10);
  document.getElementById("time").textContent =
    `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms2).padStart(2,'0')}`;
}

function update() {
  const now = Date.now();
  updateDisplay(now - startTime + elapsed);
}

function toggleStartStop() {
  const btn = document.getElementById("mainBtn");

  if (timer) {
    stop();
    btn.textContent = "Start";
    btn.style.background = "#28a745";
  } else {
    start();
    btn.textContent = "Stop";
    btn.style.background = "#dc3545";
  }
}

function start() {
  startTime = Date.now();
  timer = setInterval(update, 10);

  currentSection = { laps: [] };
  sections.push(currentSection);
  save();
  render();
}

function stop() {
  clearInterval(timer);
  timer = null;
  elapsed += Date.now() - startTime;
  save();
}

function resetAll() {
  clearInterval(timer);
  timer = null;
  elapsed = 0;
  sections = [];
  currentSection = null;
  save();
  updateDisplay(0);
  render();
}

function addLap() {
  if (!currentSection) return;

  const now = document.getElementById("time").textContent;
  const laps = currentSection.laps;

  let diff = now;
  if (laps.length > 0) diff = calcDiff(laps[laps.length - 1].time, now);

  laps.push({ time: now, diff: diff, name: "" });
  save();
  render();
}

function calcDiff(prev, now) {
  const toMS = t => {
    const [m, s] = t.split(":");
    const [sec, ms] = s.split(".");
    return m*60000 + sec*1000 + ms*10;
  };
  const diff = toMS(now) - toMS(prev);
  const m = Math.floor(diff / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  const ms2 = Math.floor((diff % 1000) / 10);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms2).padStart(2,'0')}`;
}

function changeName(secIndex, lapIndex, value) {
  sections[secIndex].laps[lapIndex].name = value;
  save();
}

function render() {
  const div = document.getElementById("sections");
  div.innerHTML = "";

  sections.forEach((sec, si) => {
    const box = document.createElement("div");
    box.className = "section";

    let html = `<h3>セクション ${si+1}</h3>`;

    sec.laps.forEach((lap, li) => {
      html += `
        <div class="lap-row">
          Lap${li+1}: ${lap.time} (+${lap.diff})
          <select onchange="changeName(${si},${li},this.value)">
            <option value="">未設定</option>
            ${names.map(n => `<option value="${n}" ${lap.name===n?"selected":""}>${n}</option>`).join("")}
          </select>
        </div>
      `;
    });

    html += `<button onclick="addLap()">Lap</button>`;
    box.innerHTML = html;
    div.appendChild(box);
  });
}

function downloadCSV() {
  let csv = "Section,Person,Lap,Time,Diff\n";

  sections.forEach((sec, si) => {
    sec.laps.forEach((lap, li) => {
      csv += `${si+1},${lap.name || ""},${li+1},${lap.time},${lap.diff}\n`;
    });
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "sections.csv";
  a.click();
  URL.revokeObjectURL(url);
}

function save() {
  localStorage.setItem("sections", JSON.stringify(sections));
}

render();
</script>

</body>
</html>
