<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>名前管理</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    background:#000;
    color:#fff;
    font-family:sans-serif;
    margin:20px;
    text-align:center;
  }
  .card {
    background:#111;
    border:1px solid #333;
    border-radius:8px;
    padding:8px;
    margin:6px 0;
    font-size:18px;
  }
  input {
    width:80%;
    font-size:18px;
    padding:6px;
    margin-bottom:8px;
  }
  button {
    font-size:16px;
    padding:8px 16px;
    border:none;
    border-radius:6px;
    color:#fff;
    margin:4px;
  }
  #addBtn { background:#28a745; }
  .delBtn { background:#dc3545; }
  #backBtn { background:#17a2b8; }
</style>
</head>
<body>

<h2>名前管理</h2>

<input id="nameInput" type="text" placeholder="名前を入力">
<button id="addBtn" onclick="addName()">追加</button>

<div id="list"></div>

<button id="backBtn" onclick="location.href='index.html'">戻る</button>

<script>
let names = JSON.parse(localStorage.getItem("peopleList") || "[]");

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  names.forEach((n, i) => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      ${n}
      <button class="delBtn" onclick="delName(${i})">削除</button>
    `;
    list.appendChild(div);
  });
}

function addName() {
  const input = document.getElementById("nameInput");
  const v = input.value.trim();
  if (!v) return;
  if (!names.includes(v)) {
    names.push(v);
    save();
    render();
  }
  input.value = "";
}

function delName(i) {
  names.splice(i, 1);
  save();
  render();
}

function save() {
  localStorage.setItem("peopleList", JSON.stringify(names));
}

render();
</script>
</body>
</html>
