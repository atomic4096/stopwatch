<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Section Stopwatch</title>

    <!-- PWA設定 -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icon-180.png">

    <!-- スプラッシュ画像 -->
    <link rel="apple-touch-startup-image" href="assets/splash-640x1136.png" media="(device-width: 320px)">
    <link rel="apple-touch-startup-image" href="assets/splash-750x1334.png" media="(device-width: 375px)">
    <link rel="apple-touch-startup-image" href="assets/splash-1125x2436.png" media="(device-width: 414px)">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Stopwatch">

    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            text-align: center;
        }
        #timeDisplay {
            font-size: 48px;
            margin: 20px 0;
        }
        button {
            font-size: 20px;
            padding: 10px 20px;
            margin: 5px;
        }
        #laps {
            margin-top: 20px;
            text-align: left;
        }
    </style>
</head>

<body>
    <h1>Section Stopwatch</h1>

    <div id="timeDisplay">00:00.00</div>

    <button id="startBtn">Start</button>
    <button id="lapBtn" disabled>Lap</button>
    <button id="stopBtn" disabled>Stop</button>
    <button id="resetBtn" disabled>Reset</button>

    <div id="laps"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>
        // ★ あなたの firebaseConfig をここに貼る
        const firebaseConfig = {
            apiKey: "",
            authDomain: "",
            projectId: "",
            storageBucket: "",
            messagingSenderId: "",
            appId: ""
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ストップウォッチ処理
        let startTime = 0;
        let timerInterval;
        let running = false;
        let laps = [];

        const timeDisplay = document.getElementById("timeDisplay");
        const startBtn = document.getElementById("startBtn");
        const lapBtn = document.getElementById("lapBtn");
        const stopBtn = document.getElementById("stopBtn");
        const resetBtn = document.getElementById("resetBtn");
        const lapsDiv = document.getElementById("laps");

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const centiseconds = Math.floor((ms % 1000) / 10);
            return (
                String(minutes).padStart(2, "0") + ":" +
                String(seconds).padStart(2, "0") + "." +
                String(centiseconds).padStart(2, "0")
            );
        }

        function updateDisplay() {
            const now = Date.now();
            const elapsed = now - startTime;
            timeDisplay.textContent = formatTime(elapsed);
        }

        startBtn.onclick = () => {
            if (!running) {
                running = true;
                startTime = Date.now();
                timerInterval = setInterval(updateDisplay, 10);
                lapBtn.disabled = false;
                stopBtn.disabled = false;
                resetBtn.disabled = true;
            }
        };

        lapBtn.onclick = () => {
            const now = Date.now();
            const elapsed = now - startTime;
            laps.push(formatTime(elapsed));
            renderLaps();
        };

        stopBtn.onclick = () => {
            running = false;
            clearInterval(timerInterval);
            lapBtn.disabled = true;
            stopBtn.disabled = true;
            resetBtn.disabled = false;

            // Firestoreへ保存
            db.collection("sections").add({
                timestamp: new Date(),
                laps: laps
            });
        };

        resetBtn.onclick = () => {
            timeDisplay.textContent = "00:00.00";
            laps = [];
            renderLaps();
        };

        function renderLaps() {
            lapsDiv.innerHTML = "";
            laps.forEach((lap, index) => {
                lapsDiv.innerHTML += `<div>Lap ${index + 1}: ${lap}</div>`;
            });
        }
    </script>
</body>
</html>
