<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>名前管理</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    background:#000;
    color:#fff;
    font-family:sans-serif;
    margin:0;
    padding-top:60px; /* 固定ヘッダー分 */
  }

  /* 固定ヘッダー */
  .top-bar {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:#111;
    border-bottom:1px solid #333;
    padding:8px;
    display:flex;
    gap:6px;
    box-sizing:border-box;
    z-index:10;
  }

  .top-bar button {
    background:#007bff;
    color:#fff;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    font-size:14px;
    white-space:nowrap;
  }

  #nameInput {
    flex:1;
    padding:8px;
    font-size:14px;
    border-radius:6px;
    border:1px solid #444;
    background:#222;
    color:#fff;
  }

  /* 名前リスト：1行2人のグリッド */
  #nameList {
    padding:10px;
    display:grid;
    grid-template-columns:1fr 1fr; /* ← 1行2人 */
    gap:8px;
  }

  .name-item {
    background:#111;
    border:1px solid #333;
    border-radius:6px;
    padding:6px 8px;
    font-size:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  .delete-btn {
    background:#dc3545;
    color:#fff;
    border:none;
    padding:4px 8px;
    border-radius:4px;
    font-size:12px;
  }
</style>
</head>
<body>

<!-- 固定ヘッダー -->
<div class="top-bar">
  <button onclick="location.href='index.html'">戻る</button>
  <input id="nameInput" placeholder="名前を入力">
  <button onclick="addName()">追加</button>
</div>

<!-- 名前リスト -->
<div id="nameList"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC7g7RRw3LxO7fBQJghrm2hvxkwcYPT55k",
  authDomain: "stopwatch-app-21e5f.firebaseapp.com",
  projectId: "stopwatch-app-21e5f",
  storageBucket: "stopwatch-app-21e5f.firebasestorage.app",
  messagingSenderId: "326918590564",
  appId: "1:326918590564:web:de3f433f71994d0a698f71"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let names = [];

/* Firestore から読み込み */
db.collection("names").doc("shared").onSnapshot(doc=>{
  if(doc.exists){
    names = doc.data().list;
    render();
  }
});

/* 名前追加 */
function addName(){
  const input = document.getElementById("nameInput");
  const val = input.value.trim();
  if(!val) return;

  names.push(val);
  input.value = "";

  db.collection("names").doc("shared").set({ list:names });
}

/* 名前削除 */
function deleteName(i){
  names.splice(i,1);
  db.collection("names").doc("shared").set({ list:names });
}

/* 描画 */
function render(){
  const list = document.getElementById("nameList");
  list.innerHTML = "";

  names.forEach((n,i)=>{
    const div = document.createElement("div");
    div.className = "name-item";
    div.innerHTML = `
      <span>${n}</span>
      <button class="delete-btn" onclick="deleteName(${i})">削除</button>
    `;
    list.appendChild(div);
  });
}
</script>

</body>
</html>
