<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>セクション一覧</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    background:#000;
    color:#fff;
    font-family:sans-serif;
    margin:0;
    padding:12px 8px 80px;
  }
  .section {
    background:#111;
    border:1px solid #333;
    border-radius:8px;
    padding:10px;
    margin-bottom:10px;
  }
  .lap-row {
    font-size:16px;
    margin:4px 0;
  }
  .summary {
    margin-top:8px;
    padding-top:6px;
    border-top:1px dashed #444;
    font-size:14px;
  }
  .bottom-bar {
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    background:#111;
    border-top:1px solid #333;
    padding:8px 4px;
    display:flex;
    gap:4px;
    box-sizing:border-box;
  }
  .bottom-bar button {
    flex:1;
    padding:10px 0;
    font-size:16px;
    border:none;
    border-radius:6px;
    color:#fff;
  }
  #backBtn { background:#17a2b8; }
  #csvBtn { background:#fd7e14; }
</style>
</head>
<body>

<h2>セクション一覧</h2>
<div id="sections"></div>

<div class="bottom-bar">
  <button id="backBtn" onclick="location.href='index.html'">戻る</button>
  <button id="csvBtn" onclick="downloadCSV()">CSV</button>
</div>

<script>
let sections = JSON.parse(localStorage.getItem("sections_v2") || "[]");

function toMS(t) {
  const [m, s] = t.split(":");
  const [sec, ms] = s.split(".");
  return Number(m)*60000 + Number(sec)*1000 + Number(ms)*10;
}
function fromMS(ms) {
  const m = Math.floor(ms/60000);
  const s = Math.floor((ms%60000)/1000);
  const ms2 = Math.floor((ms%1000)/10);
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(ms2).padStart(2,"0")}`;
}

function buildPersonSummary(sec) {
  const result = {};
  sec.laps.forEach((lap, idx) => {
    if (!lap.name) return;
    if (!result[lap.name]) {
      result[lap.name] = { indices: [], laps: [] };
    }
    result[lap.name].indices.push(idx);
    result[lap.name].laps.push(lap);
  });
  return result;
}

function render() {
  const container = document.getElementById("sections");
  container.innerHTML = "";

  sections.forEach((sec, si) => {
    const box = document.createElement("div");
    box.className = "section";

    let html = `<h3>セクション ${si+1}</h3>`;

    const lapCountsByName = {};
    sec.laps.forEach((lap, li) => {
      let lapCount = "";
      if (lap.name) {
        if (!lapCountsByName[lap.name]) lapCountsByName[lap.name] = 0;
        lapCountsByName[lap.name]++;
        lapCount = lapCountsByName[lap.name];
      }
      html += `
        <div class="lap-row">
          LAP${li+1} ${lap.time} (+${lap.diff})
          ${lap.name ? `　${lap.name}　周回${lapCount}` : ""}
        </div>
      `;
    });

    const summary = buildPersonSummary(sec);
    const persons = Object.keys(summary);
    if (persons.length > 0) {
      html += `<div class="summary">`;
      persons.forEach(name => {
        const info = summary[name];
        if (info.indices.length >= 2) {
          const firstIdx = info.indices[0];
          const lastIdx = info.indices[info.indices.length - 1];
          const total = fromMS(toMS(sec.laps[lastIdx].time) - toMS(sec.laps[firstIdx].time));
          html += `<div><strong>${name}</strong><br>
            区間1: LAP${firstIdx+1} → LAP${lastIdx+1} = ${total}<br>
            　LAP${firstIdx+1}: ${sec.laps[firstIdx].time}<br>
            　LAP${lastIdx+1}: ${sec.laps[lastIdx].time}<br>
          </div>`;
        }
      });
      html += `</div>`;
    }

    box.innerHTML = html;
    container.appendChild(box);
  });
}

function downloadCSV() {
  let csv = "Section,LapIndex,Time,Diff,Name,LapCount\n";
  sections.forEach((sec, si) => {
    const lapCountsByName = {};
    sec.laps.forEach((lap, li) => {
      let lapCount = "";
      if (lap.name) {
        if (!lapCountsByName[lap.name]) lapCountsByName[lap.name] = 0;
        lapCountsByName[lap.name]++;
        lapCount = lapCountsByName[lap.name];
      }
      csv += `${si+1},${li+1},${lap.time},${lap.diff},${lap.name || ""},${lapCount}\n`;
    });
  });
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "sections.csv";
  a.click();
  URL.revokeObjectURL(url);
}

render();
</script>
</body>
</html>
