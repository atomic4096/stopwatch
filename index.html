<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Stopwatch</title>
<style>
  body { font-family: sans-serif; padding: 20px; }
  .lap-item { margin: 5px 0; }
</style>
</head>
<body>

<h2>ストップウォッチ</h2>

<div id="timer" style="font-size: 40px;">00:00.00</div>

<button onclick="startTimer()">Start</button>
<button onclick="stopTimer()">Stop</button>
<button onclick="resetTimer()">Reset</button>

<h3>ラップ</h3>
<div id="laps"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC7g7RRw3LxO7fBQJghrm2hvxkwcYPT55k",
  authDomain: "stopwatch-app-21e5f.firebaseapp.com",
  projectId: "stopwatch-app-21e5f",
  storageBucket: "stopwatch-app-21e5f.firebasestorage.app",
  messagingSenderId: "326918590564",
  appId: "1:326918590564:web:de3f433f71994d0a698f71"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let startTime = 0;
let running = false;
let laps = [];
let timerInterval = null;
let names = [];

// 名前リストを同期
db.collection("names").doc("shared").onSnapshot(doc => {
  if (doc.exists) names = doc.data().list;
  renderLaps();
});

function formatTime(ms) {
  const t = ms / 1000;
  const m = Math.floor(t / 60);
  const s = (t % 60).toFixed(2).padStart(5, "0");
  return `${String(m).padStart(2, "0")}:${s}`;
}

function updateTimer() {
  const now = Date.now();
  document.getElementById("timer").textContent = formatTime(now - startTime);
}

function startTimer() {
  if (running) return;
  running = true;
  startTime = Date.now();
  timerInterval = setInterval(updateTimer, 10);
}

async function stopTimer() {
  if (!running) return;
  running = false;
  clearInterval(timerInterval);

  const memo = prompt("セクションのメモを入力してください", "");
  if (memo === null) return;

  const section = {
    timestamp: Date.now(),
    memo: memo,
    laps: laps,
    names: {}
  };

  await db.collection("sections").add(section);

  laps = [];
  renderLaps();
  document.getElementById("timer").textContent = "00:00.00";
}

function resetTimer() {
  running = false;
  clearInterval(timerInterval);
  laps = [];
  renderLaps();
  document.getElementById("timer").textContent = "00:00.00";
}

function renderLaps() {
  const container = document.getElementById("laps");
  container.innerHTML = "";

  laps.forEach((lap, i) => {
    const div = document.createElement("div");
    div.className = "lap-item";

    const select = document.createElement("select");
    select.innerHTML = `<option value="">未割り当て</option>` +
      names.map(n => `<option value="${n}">${n}</option>`).join("");

    select.onchange = () => {
      laps[i].name = select.value;
    };

    div.textContent = `${i + 1}：${formatTime(lap.time)} `;
    div.appendChild(select);
    container.appendChild(div);
  });
}
</script>

</body>
</html>
