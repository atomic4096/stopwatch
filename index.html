<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Multi Stopwatch</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    background: #000;
    color: #fff;
    font-family: sans-serif;
    margin: 20px;
    text-align: center;
  }
  #time {
    font-size: 70px;
    margin: 20px 0;
  }
  button {
    font-size: 20px;
    padding: 14px 26px;
    margin: 6px;
    border: none;
    border-radius: 8px;
    color: #fff;
  }
  #startBtn { background: #28a745; }
  #stopBtn { background: #dc3545; }
  #resetBtn { background: #6c757d; }
  #csvBtn { background: #fd7e14; }

  .person-card {
    background: #111;
    border: 1px solid #333;
    padding: 12px;
    margin: 12px 0;
    border-radius: 8px;
    text-align: left;
  }
  .lap-btn {
    background: #007bff;
    padding: 8px 16px;
    border-radius: 6px;
    border: none;
    color: #fff;
    margin-top: 6px;
  }
  input, select {
    font-size: 18px;
    padding: 6px;
    margin: 6px;
    width: 80%;
  }
</style>
</head>
<body>

<div id="time">00:00.00</div>

<button id="startBtn" onclick="start()">Start</button>
<button id="stopBtn" onclick="stop()">Stop</button>
<button id="resetBtn" onclick="resetAll()">Reset</button>
<button id="csvBtn" onclick="downloadCSV()">CSV</button>

<h3>名前追加</h3>
<select id="nameSelect"></select><br>
<input id="nameInput" type="text" placeholder="名前を入力">
<button onclick="addPerson()">追加</button>

<div id="people"></div>

<script>
let startTime;
let timer = null;
let elapsed = 0;
let people = [];
let savedNames = JSON.parse(localStorage.getItem("savedNames") || "[]");

function loadSavedData() {
  const saved = JSON.parse(localStorage.getItem("peopleData") || "[]");
  const savedElapsed = Number(localStorage.getItem("elapsedTime") || 0);
  const running = localStorage.getItem("running") === "true";

  people = saved;
  elapsed = savedElapsed;

  renderPeople();

  if (running) {
    startTime = Date.now();
    timer = setInterval(update, 10);
  } else {
    updateDisplay(elapsed);
  }

  updateNameSelect();
}

function updateNameSelect() {
  const sel = document.getElementById("nameSelect");
  sel.innerHTML = "";
  savedNames.forEach(n => {
    const op = document.createElement("option");
    op.value = n;
    op.textContent = n;
    sel.appendChild(op);
  });
}

function updateDisplay(ms) {
  const minutes = Math.floor(ms / 60000);
  const seconds = Math.floor((ms % 60000) / 1000);
  const msec = Math.floor((ms % 1000) / 10);
  document.getElementById("time").textContent =
    `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}.${String(msec).padStart(2,'0')}`;
}

function update() {
  const now = Date.now();
  const diff = now - startTime + elapsed;
  updateDisplay(diff);
}

function start() {
  if (timer) return;
  startTime = Date.now();
  timer = setInterval(update, 10);
  localStorage.setItem("running", "true");
}

function stop() {
  if (!timer) return;
  elapsed += Date.now() - startTime;
  clearInterval(timer);
  timer = null;
  localStorage.setItem("running", "false");
  localStorage.setItem("elapsedTime", elapsed);
}

function resetAll() {
  clearInterval(timer);
  timer = null;
  elapsed = 0;
  people = [];
  savedNames = [];
  localStorage.clear();
  updateDisplay(0);
  renderPeople();
  updateNameSelect();
}

function addPerson() {
  let name = document.getElementById("nameInput").value.trim();
  if (!name) name = document.getElementById("nameSelect").value;
  if (!name) return;

  if (!savedNames.includes(name)) {
    savedNames.push(name);
    localStorage.setItem("savedNames", JSON.stringify(savedNames));
    updateNameSelect();
  }

  people.push({ name: name, laps: [] });
  renderPeople();
  saveData();
}

function addLap(index) {
  const nowText = document.getElementById("time").textContent;
  const person = people[index];

  let diff = nowText;
  if (person.laps.length > 0) {
    diff = calcDiff(person.laps[person.laps.length - 1].time, nowText);
  }

  person.laps.push({ time: nowText, diff: diff });
  renderPeople();
  saveData();
}

function calcDiff(prev, now) {
  const toMS = t => {
    const [m, s] = t.split(":");
    const [sec, ms] = s.split(".");
    return Number(m)*60000 + Number(sec)*1000 + Number(ms)*10;
  };
  const diff = toMS(now) - toMS(prev);
  const minutes = Math.floor(diff / 60000);
  const seconds = Math.floor((diff % 60000) / 1000);
  const msec = Math.floor((diff % 1000) / 10);
  return `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}.${String(msec).padStart(2,'0')}`;
}

function renderPeople() {
  const div = document.getElementById("people");
  div.innerHTML = "";

  people.forEach((p, i) => {
    const card = document.createElement("div");
    card.className = "person-card";

    let html = `<strong>${p.name}</strong><br>`;
    p.laps.forEach((lap, idx) => {
      html += `Lap${idx+1}: ${lap.time} (+${lap.diff})<br>`;
    });

    html += `<button class="lap-btn" onclick="addLap(${i})">Lap</button>`;
    card.innerHTML = html;
    div.appendChild(card);
  });
}

function saveData() {
  localStorage.setItem("peopleData", JSON.stringify(people));
  localStorage.setItem("elapsedTime", elapsed);
}

function downloadCSV() {
  let csv = "Person,Lap,Time,Diff\n";
  people.forEach(p => {
    p.laps.forEach((lap, i) => {
      csv += `${p.name},${i+1},${lap.time},${lap.diff}\n`;
    });
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "laps.csv";
  a.click();
  URL.revokeObjectURL(url);
}

loadSavedData();
</script>

</body>
</html>
