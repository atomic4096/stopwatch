<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Section Stopwatch</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- iPhone アプリ化 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Stopwatch">

<!-- ▼▼ ここから追加（PWA設定） ▼▼ -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-180.png">

<link rel="apple-touch-startup-image" href="assets/splash-640x1136.png" media="(device-width: 320px)">
<link rel="apple-touch-startup-image" href="assets/splash-750x1334.png" media="(device-width: 375px)">
<link rel="apple-touch-startup-image" href="assets/splash-1125x2436.png" media="(device-width: 414px)">
<!-- ▲▲ ここまで追加 ▲▲ -->

<style>
  body {
    background:#000;
    color:#fff;
    font-family:sans-serif;
    margin:0;
    padding-top:90px;
    padding-bottom:120px;
  }

  #time {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:#111;
    border-bottom:1px solid #333;
    font-size:48px;
    text-align:center;
    padding:12px 0;
    z-index:10;
  }

  #sections { padding:8px; }

  .section {
    background:#111;
    border:1px solid #333;
    border-radius:8px;
    padding:10px;
    margin-bottom:10px;
  }

  .section-title { font-size:16px; margin:0 0 6px 0; }
  .lap-row { font-size:16px; margin:4px 0; }

  .summary {
    margin-top:8px;
    padding-top:6px;
    border-top:1px dashed #444;
    font-size:14px;
  }

  select {
    font-size:14px;
    padding:2px 4px;
    margin-left:6px;
  }

  .memo-input {
    width:100%;
    font-size:14px;
    padding:4px;
    margin:6px 0 10px 0;
    border-radius:4px;
    border:1px solid #444;
    background:#222;
    color:#fff;
  }

  .save-btn {
    margin-top:6px;
    padding:6px 10px;
    font-size:14px;
    border:none;
    border-radius:4px;
    background:#fd7e14;
    color:#fff;
  }

  .bottom-bar {
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    background:#111;
    border-top:1px solid #333;
    padding:8px 4px;
    display:flex;
    gap:4px;
    box-sizing:border-box;
  }
  .bottom-bar button {
    flex:1;
    padding:10px 0;
    font-size:16px;
    border:none;
    border-radius:6px;
    color:#fff;
  }
  #mainBtn { background:#28a745; }
  #lapBtn { background:#007bff; }
  #resetBtn { background:#6c757d; }
  #nameBtn { background:#17a2b8; }
  #secBtn { background:#6610f2; }
</style>
</head>
<body>

<div id="time">00:00.00</div>
<div id="sections"></div>

<div class="bottom-bar">
  <button id="mainBtn" onclick="toggleStartStop()">Start</button>
  <button id="lapBtn" onclick="addLap()">Lap</button>
  <button id="resetBtn" onclick="resetAll()">Reset</button>
  <button id="nameBtn" onclick="location.href='names.html'">名前</button>
  <button id="secBtn" onclick="location.href='sections.html'">セクション</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>

</script>

</body>
</html>
