<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>名前管理</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    background:#000;
    color:#fff;
    font-family:sans-serif;
    margin:0;
    padding:0;
  }

  /* 上部固定バー（戻る＋入力＋追加） */
  .top-bar {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:#111;
    border-bottom:1px solid #333;
    padding:10px;
    z-index:10;
  }

  .top-row {
    display:flex;
    gap:6px;
  }

  .backBtn {
    background:#17a2b8;
    color:#fff;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    font-size:16px;
    white-space:nowrap;
  }

  .nameInput {
    flex:1;
    padding:8px;
    font-size:16px;
    border-radius:6px;
    border:1px solid #444;
    background:#222;
    color:#fff;
  }

  .addBtn {
    background:#28a745;
    color:#fff;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    font-size:16px;
    white-space:nowrap;
  }

  /* スクロール領域 */
  .content {
    position:fixed;
    top:70px; /* 上部バーの高さ */
    bottom:0;
    left:0;
    right:0;
    overflow-y:auto;
    padding:10px;
  }

  /* 名前カード（コンパクト） */
  .name-item {
    background:#111;
    border:1px solid #333;
    padding:8px 10px;
    border-radius:6px;
    margin-bottom:6px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:15px;
  }

  .deleteBtn {
    background:#dc3545;
    color:#fff;
    border:none;
    padding:4px 8px;
    border-radius:6px;
    font-size:14px;
  }
</style>
</head>
<body>

<!-- 上部固定バー -->
<div class="top-bar">
  <div class="top-row">
    <button class="backBtn" onclick="location.href='index.html'">戻る</button>
    <input id="newName" class="nameInput" placeholder="名前を入力">
    <button class="addBtn" onclick="addName()">追加</button>
  </div>
</div>

<!-- スクロール領域 -->
<div class="content">
  <div id="nameList"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC7g7RRw3LxO7fBQJghrm2hvxkwcYPT55k",
  authDomain: "stopwatch-app-21e5f.firebaseapp.com",
  projectId: "stopwatch-app-21e5f",
  storageBucket: "stopwatch-app-21e5f.firebasestorage.app",
  messagingSenderId: "326918590564",
  appId: "1:326918590564:web:de3f433f71994d0a698f71"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let names = [];

/* Firestore 同期 */
db.collection("names").doc("shared").onSnapshot(doc => {
  if (doc.exists) {
    names = doc.data().list || [];
    render();
  }
});

/* 名前追加 */
function addName(){
  const val = document.getElementById("newName").value.trim();
  if(!val) return;

  names.push(val);
  db.collection("names").doc("shared").set({ list:names });

  document.getElementById("newName").value = "";
}

/* 名前削除 */
function deleteName(i){
  if(!confirm("削除しますか？")) return;

  names.splice(i,1);
  db.collection("names").doc("shared").set({ list:names });
}

/* 描画 */
function render(){
  const box = document.getElementById("nameList");
  box.innerHTML = "";

  names.forEach((n,i)=>{
    const div = document.createElement("div");
    div.className = "name-item";
    div.innerHTML = `
      <span>${n}</span>
      <button class="deleteBtn" onclick="deleteName(${i})">削除</button>
    `;
    box.appendChild(div);
  });
}
</script>

</body>
</html>
