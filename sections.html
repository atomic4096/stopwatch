<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>セクション一覧</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    background:#000;
    color:#fff;
    font-family:sans-serif;
    margin:0;
    padding:0;
  }

  /* 上部固定バー */
  .top-bar {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:#111;
    border-bottom:1px solid #333;
    padding:10px;
    z-index:10;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  .top-btn {
    background:#17a2b8;
    color:#fff;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    font-size:16px;
  }

  .csv-btn {
    background:#fd7e14;
    color:#fff;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    font-size:16px;
  }

  .title {
    font-size:18px;
    font-weight:bold;
  }

  /* スクロール領域 */
  .content {
    padding:70px 10px 20px;
    height:calc(100vh - 70px);
    overflow-y:auto;
  }

  .section {
    background:#111;
    border:1px solid #333;
    border-radius:8px;
    padding:10px;
    margin-bottom:10px;
  }

  .header {
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:6px;
  }

  .info {
    font-size:14px;
    margin-bottom:8px;
    color:#ccc;
  }

  .info input {
    width:100%;
    padding:6px;
    margin:4px 0;
    border-radius:6px;
    border:1px solid #444;
    background:#222;
    color:#fff;
    font-size:14px;
  }

  .lap-row {
    font-size:16px;
    margin:4px 0;
  }

  select {
    font-size:14px;
    padding:2px 4px;
    margin-left:6px;
  }

  .summary {
    margin-top:8px;
    padding-top:6px;
    border-top:1px dashed #444;
    font-size:14px;
  }

  .deleteBtn {
    background:#dc3545;
    color:#fff;
    padding:6px 10px;
    border:none;
    border-radius:6px;
    margin-top:10px;
  }
</style>
</head>
<body>

<!-- 上部固定バー -->
<div class="top-bar">
  <button class="top-btn" onclick="location.href='index.html'">戻る</button>
  <div class="title">セクション一覧</div>
  <button class="csv-btn" onclick="downloadCSV()">CSV</button>
</div>

<!-- スクロール領域 -->
<div class="content">
  <div id="sections"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
/* Firebase 設定 */
const firebaseConfig = {
  apiKey: "AIzaSyC7g7RRw3LxO7fBQJghrm2hvxkwcYPT55k",
  authDomain: "stopwatch-app-21e5f.firebaseapp.com",
  projectId: "stopwatch-app-21e5f",
  storageBucket: "stopwatch-app-21e5f.firebasestorage.app",
  messagingSenderId: "326918590564",
  appId: "1:326918590564:web:de3f433f71994d0a698f71"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let names = [];
let currentList = [];

/* 名前リスト同期 */
db.collection("names").doc("shared").onSnapshot(doc => {
  if (doc.exists) names = doc.data().list;
});

/* セクション一覧取得 */
db.collection("sections")
  .orderBy("timestamp", "desc")
  .onSnapshot(snapshot => {
    currentList = [];
    snapshot.forEach(doc => currentList.push({ id: doc.id, ...doc.data() }));
    render(currentList);
  });

/* 時刻変換 */
function toMS(t){
  const [m,s]=t.split(":");
  const [sec,ms]=s.split(".");
  return Number(m)*60000+Number(sec)*1000+Number(ms)*10;
}
function formatCSVTime(ms){
  const m=Math.floor(ms/60000);
  const s=Math.floor((ms%60000)/1000);
  const ms2=Math.floor((ms%1000)/10);
  return `${m}:${String(s).padStart(2,"0")}.${String(ms2).padStart(2,"0")}`;
}

/* 名前変更（安全に全体上書き） */
function changeName(secId, lapIndex, value){
  const sec = currentList.find(s => s.id === secId);
  if (!sec) return;

  if (!Array.isArray(sec.laps)) {
    sec.laps = Object.values(sec.laps || {});
  }

  sec.laps[lapIndex].name = value;

  db.collection("sections").doc(secId).update({
    laps: sec.laps
  });
}

/* 練習内容・天気・風の編集 */
function updateField(secId, field, value){
  db.collection("sections").doc(secId).update({
    [field]: value
  });
}

/* 人ごとのラップ */
function buildPersonLapData(sec){
  const data={};
  sec.laps.forEach((lap,idx)=>{
    if(!lap.name) return;
    if(!data[lap.name]) data[lap.name]=[];
    data[lap.name].push({ index:idx, time:lap.time });
  });
  return data;
}

/* 描画 */
function render(list){
  const container=document.getElementById("sections");
  container.innerHTML="";

  list.forEach(sec => {

    if (!Array.isArray(sec.laps)) {
      sec.laps = Object.values(sec.laps || {});
    }

    const box=document.createElement("div");
    box.className="section";

    const header=document.createElement("div");
    header.className="header";
    header.textContent = `${sec.date}｜${sec.practice || ""}`;

    const body=document.createElement("div");
    body.style.display="none";

    /* 練習内容・天気・風 */
    body.innerHTML += `
      <div class="info">
        <div>練習内容</div>
        <input value="${sec.practice || ""}" 
          oninput="updateField('${sec.id}', 'practice', this.value)">
        <div>天気</div>
        <input value="${sec.weather || ""}" 
          oninput="updateField('${sec.id}', 'weather', this.value)">
        <div>風</div>
        <input value="${sec.wind || ""}" 
          oninput="updateField('${sec.id}', 'wind', this.value)">
      </div>
    `;

    /* ラップ一覧 */
    sec.laps.forEach((lap,li)=>{
      const row=document.createElement("div");
      row.className="lap-row";

      const select=document.createElement("select");
      select.innerHTML =
        `<option value="">未設定</option>` +
        names.map(n=>`<option value="${n}">${n}</option>`).join("");

      if(lap.name) select.value = lap.name;

      select.onchange = () => changeName(sec.id, li, select.value);

      row.innerHTML = `LAP${li+1} ${lap.time} (+${lap.diff}) `;
      row.appendChild(select);
      body.appendChild(row);
    });

    /* 人ごとのまとめ */
    const personData=buildPersonLapData(sec);
    const persons=Object.keys(personData);

    if(persons.length>0){
      const sum=document.createElement("div");
      sum.className="summary";

      persons.forEach(name=>{
        const laps=personData[name];
        let html=`<div><strong>${name}</strong><br>`;
        laps.forEach((lp,i)=>{
          let lapTime;
          if(i===0) lapTime=lp.time;
          else lapTime=formatCSVTime(toMS(laps[i].time)-toMS(laps[i-1].time));
          html+=`　周回${i+1}: ${lapTime}<br>`;
        });
        html+=`</div>`;
        sum.innerHTML += html;
      });

      body.appendChild(sum);
    }

    /* 削除ボタン */
    const del=document.createElement("button");
    del.className="deleteBtn";
    del.textContent="削除";
    del.onclick=()=>{
      if(confirm("削除しますか？")){
        db.collection("sections").doc(sec.id).delete();
      }
    };
    body.appendChild(del);

    header.onclick = () => {
      body.style.display = body.style.display==="none" ? "block" : "none";
    };

    box.appendChild(header);
    box.appendChild(body);
    container.appendChild(box);
  });
}

/* CSV 出力 */
function downloadCSV(){
  db.collection("sections").orderBy("timestamp","asc").get().then(snapshot=>{
    const list=[];
    snapshot.forEach(doc=>list.push(doc.data()));

    if(list.length===0){
      alert("セクションがありません");
      return;
    }

    let maxLaps=0;
    list.forEach(sec=>{
      const personData=buildPersonLapData(sec);
      Object.values(personData).forEach(laps=>{
        if(laps.length>maxLaps) maxLaps=laps.length;
      });
    });

    let header="日付,練習内容,天気,風,名前";
    for(let i=1;i<=maxLaps;i++){
      header+=`,周回${i}`;
    }
    header+="\n";

    let csv=header;

    list.forEach(sec=>{
      const personData=buildPersonLapData(sec);
      const persons=Object.keys(personData);

      persons.forEach(name=>{
        const laps=personData[name];
        const lapTimes=[];

        laps.forEach((lp,i)=>{
          if(i===0) lapTimes.push(lp.time);
          else lapTimes.push(formatCSVTime(toMS(laps[i].time)-toMS(laps[i-1].time)));
        });

        while(lapTimes.length<maxLaps) lapTimes.push("");

        csv+=`${sec.date},"${sec.practice || ""}","${sec.weather || ""}","${sec.wind || ""}",${name},${lapTimes.join(",")}\n`;
      });
    });

    const bom="\uFEFF";
    const blob=new Blob([bom+csv],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="sections.csv";
    a.click();
    URL.revokeObjectURL(url);
  });
}
</script>

</body>
</html>
