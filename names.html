<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>名前管理</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    background:#000;
    color:#fff;
    font-family:sans-serif;
    margin:20px;
    text-align:center;
  }
  .card {
    background:#111;
    border:1px solid #333;
    border-radius:8px;
    padding:6px;
    margin:6px 0;
    font-size:14px;
  }
  input {
    width:80%;
    font-size:16px;
    padding:6px;
    margin-bottom:8px;
  }
  button {
    font-size:14px;
    padding:8px 16px;
    border:none;
    border-radius:6px;
    color:#fff;
    margin:4px;
  }
  #addBtn { background:#28a745; }
  .delBtn { background:#dc3545; }
  #backBtn { background:#17a2b8; }
</style>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body>

<h2>名前管理</h2>

<input id="nameInput" type="text" placeholder="名前を入力">
<button id="addBtn" onclick="addName()">追加</button>

<div id="list"></div>

<button id="backBtn" onclick="location.href='index.html'">戻る</button>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBVCmJeQ53o8zch4KKkmt9-sYRzr7DuP0g",
  authDomain: "stopwatch-app-3141a.firebaseapp.com",
  projectId: "stopwatch-app-3141a",
  storageBucket: "stopwatch-app-3141a.firebasestorage.app",
  messagingSenderId: "775156158989",
  appId: "1:775156158989:web:27baf16c072483ded67b44"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
firebase.auth().signInAnonymously().catch(console.error);

let names=[];

function render(){
  const list=document.getElementById("list");
  list.innerHTML="";
  names.forEach(n=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`
      ${n}
      <button class="delBtn" onclick="delName('${n}')">削除</button>
    `;
    list.appendChild(div);
  });
}

function addName(){
  const input=document.getElementById("nameInput");
  const v=input.value.trim();
  if(!v) return;
  db.collection("names").doc(v).set({
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>{
    input.value="";
  });
}

function delName(name){
  db.collection("names").doc(name).delete();
}

db.collection("names").orderBy("createdAt","asc")
  .onSnapshot(snap=>{
    names=[];
    snap.forEach(doc=>names.push(doc.id));
    render();
  });
</script>
</body>
</html>
