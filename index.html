<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>練習メニュー音出し</title>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<style>
  body {
    font-family: sans-serif;
    background: #000;
    margin: 0;
    padding: 20px;
    padding-bottom: 260px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }

  .menu-btn {
    padding: 25px;
    font-size: 36px;
    width: 100%;
    height: 180px;
    border-radius: 20px;
    border: 4px solid #FFD700;
    background: #E53935;
    color: #fff;
    font-weight: bold;
  }

  .menu-btn:active {
    transform: scale(0.95);
    background: #B71C1C;
  }

  /* 練習メニューボタン（特別デザイン） */
  .nav-btn {
    grid-column: span 2;
    height: 150px;
    font-size: 40px;
    background: #FFD700;
    color: #000;
    border-radius: 20px;
    border: 4px solid #E53935;
    font-weight: bold;
  }

  .control-area {
    position: fixed;
    bottom: 20px;
    left: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .control {
    width: 60%;
    height: 110px;
    font-size: 50px;
    border-radius: 20px;
    border: 4px solid #FFD700;
    background: #444;
    color: #FFD700;
  }

  #repeatBtn {
    background: #333;
    color: #FFD700;
  }

  #repeatBtn.active {
    background: #FFD700;
    color: #000;
  }
</style>
</head>
<body>

<!-- 練習メニューへ移動 -->
<button class="nav-btn" onclick="location.href='menu.html'">練習メニュー</button>

<!-- 2×4 の音源ボタン -->
<button class="menu-btn" data-sound="1">ストレッチ</button>
<button class="menu-btn" data-sound="2">外周</button>
<button class="menu-btn" data-sound="3">1分スピン/プランク/ブリッジ</button>
<button class="menu-btn" data-sound="4">足出し足着き</button>
<button class="menu-btn" data-sound="5">アイドリング/ピルエット</button>
<button class="menu-btn" data-sound="6">乗り技</button>
<button class="menu-btn" data-sound="7">振り練</button>
<button class="menu-btn" data-sound="8">30秒スピン</button>

<div class="control-area">
  <button id="resumeBtn" class="control">▶</button>
  <button id="pauseBtn" class="control">⏸</button>
  <button id="repeatBtn" class="control">🔁</button>
</div>

<script>
  const base = "https://raw.githubusercontent.com/atomic4096/music/main/";

  const soundURLs = {
    1: base + "stretch.mp3",
    2: base + "outer_loop.mp3",
    3: base + "spin_1min.mp3",
    4: base + "leg_spin.mp3",
    5: base + "idling_figure8.mp3",
    6: base + "trick_riding.mp3",
    7: base + "swing_practice.mp3",
    8: base + "spin_30sec.mp3"
  };

  const audios = {};
  let currentPlaying = null;
  let repeatMode = false;

  for (let i = 1; i <= 8; i++) {
    audios[i] = new Audio(soundURLs[i]);
  }

  document.querySelectorAll(".menu-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = Number(btn.dataset.sound);

      for (let i = 1; i <= 8; i++) {
        audios[i].pause();
        audios[i].currentTime = 0;
      }

      currentPlaying = audios[id];
      currentPlaying.loop = repeatMode;
      currentPlaying.play();
    });
  });

  document.getElementById("pauseBtn").addEventListener("click", () => {
    if (currentPlaying) currentPlaying.pause();
  });

  document.getElementById("resumeBtn").addEventListener("click", () => {
    if (currentPlaying) currentPlaying.play();
  });

  document.getElementById("repeatBtn").addEventListener("click", () => {
    repeatMode = !repeatMode;
    const btn = document.getElementById("repeatBtn");
    btn.classList.toggle("active", repeatMode);
    if (currentPlaying) currentPlaying.loop = repeatMode;
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }
</script>

</body>
</html>
