<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Saved Sections</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    background:#000;
    color:#fff;
    font-family:sans-serif;
    margin:0;
  }

  /* ★ 固定ヘッダー（戻るボタン） */
  .top-bar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: #111;
    border-bottom: 1px solid #333;
    padding: 10px;
    z-index: 10;
    display: flex;
    align-items: center;
  }

  /* ★ names.html と同じ色に統一 */
  .top-bar button {
    padding: 10px 14px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    background: #17a2b8; /* ← 統一色 */
    color: #fff;
  }

  #list {
    padding: 70px 10px 20px;
  }

  .section {
    background:#111;
    border:1px solid #333;
    border-radius:8px;
    padding:10px;
    margin-bottom:12px;
  }

  .section-title {
    font-size:18px;
    margin:0 0 6px 0;
  }

  .info-line {
    font-size:14px;
    margin-bottom:4px;
  }

  .lap-row {
    font-size:15px;
    margin:4px 0;
  }

  select {
    font-size:14px;
    padding:2px 4px;
    margin-left:6px;
  }

  .summary {
    margin-top:8px;
    padding-top:6px;
    border-top:1px dashed #444;
    font-size:14px;
  }

  .delete-btn {
    margin-top:10px;
    padding:8px 12px;
    font-size:14px;
    border:none;
    border-radius:6px;
    background:#c62828;
    color:#fff;
  }
</style>
</head>
<body>

<div class="top-bar">
  <button onclick="location.href='index.html'">戻る</button>
</div>

<div id="list"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
// Firebase 設定
const firebaseConfig = {
  apiKey: "AIzaSyC7g7RRw3LxO7fBQJghrm2hvxkwcYPT55k",
  authDomain: "stopwatch-app-21e5f.firebaseapp.com",
  projectId: "stopwatch-app-21e5f",
  storageBucket: "stopwatch-app-21e5f.firebasestorage.app",
  messagingSenderId: "326918590564",
  appId: "1:326918590564:web:de3f433f71994d0a698f71"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ===== 名前リスト ===== */
let names = [];
db.collection("names").doc("shared").onSnapshot(doc => {
  if (doc.exists) names = doc.data().list;
});

/* ===== ミリ秒変換 ===== */
function toMS(t){
  const [m,s]=t.split(":");
  const [sec,ms]=s.split(".");
  return Number(m)*60000+Number(sec)*1000+Number(ms)*10;
}
function fromMS(ms){
  const m=Math.floor(ms/60000);
  const s=Math.floor((ms%60000)/1000);
  const ms2=Math.floor((ms%1000)/10);
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(ms2).padStart(2,"0")}`;
}

/* ===== Firestore 読み込み ===== */
db.collection("sections")
  .orderBy("timestamp", "desc")
  .onSnapshot(snapshot => {
    const list = document.getElementById("list");
    list.innerHTML = "";

    snapshot.forEach(doc => {
      const sec = doc.data();
      const id = doc.id;

      const box = document.createElement("div");
      box.className = "section";

      let html = `
        <h3 class="section-title">${sec.date}</h3>
        <div class="info-line">天気：${sec.weather || "（未入力）"}</div>
        <div class="info-line">種目：${sec.practice || "（未入力）"}</div>
        <div class="info-line">メモ：${sec.memo || "（未入力）"}</div>
      `;

      sec.laps.forEach((lap, i) => {
        html += `
          <div class="lap-row">
            LAP${i+1} ${lap.time} (+${lap.diff})
            <select onchange="updateLapName('${id}', ${i}, this.value)">
              <option value="">未設定</option>
              ${names.map(n => `<option value="${n}" ${lap.name===n?"selected":""}>${n}</option>`).join("")}
            </select>
          </div>
        `;
      });

      const personData = {};
      sec.laps.forEach((lap, idx) => {
        if (!lap.name) return;
        if (!personData[lap.name]) personData[lap.name] = [];
        personData[lap.name].push({ index: idx, time: lap.time });
      });

      const persons = Object.keys(personData);
      if (persons.length > 0) {
        html += `<div class="summary">`;
        persons.forEach(name => {
          const laps = personData[name];
          html += `<div><strong>${name}</strong><br>`;
          laps.forEach((lp, i) => {
            let lapTime = (i === 0)
              ? lp.time
              : fromMS(toMS(laps[i].time) - toMS(laps[i-1].time));
            html += `　周回${i+1}: ${lapTime}<br>`;
          });
          html += `</div>`;
        });
        html += `</div>`;
      }

      html += `
        <button class="delete-btn" onclick="deleteSection('${id}')">
          このセクションを削除
        </button>
      `;

      box.innerHTML = html;
      list.appendChild(box);
    });
  });

/* ===== ラップの名前を更新 ===== */
function updateLapName(sectionId, lapIndex, newName){
  db.collection("sections").doc(sectionId).get().then(doc => {
    if (!doc.exists) return;

    const sec = doc.data();
    sec.laps[lapIndex].name = newName;

    db.collection("sections").doc(sectionId).update({
      laps: sec.laps
    });
  });
}

/* ===== セクション削除 ===== */
function deleteSection(id){
  if(confirm("本当に削除しますか？")){
    db.collection("sections").doc(id).delete();
  }
}
</script>

</body>
</html>
