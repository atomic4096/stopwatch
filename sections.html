<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>セクション一覧</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    background:#000;
    color:#fff;
    font-family:sans-serif;
    margin:0;
    padding:12px 8px 80px;
  }
  h2 { margin:8px; }
  .section {
    background:#111;
    border:1px solid #333;
    border-radius:8px;
    padding:10px;
    margin-bottom:10px;
  }
  .section-title { font-size:16px; margin:0 0 6px 0; }
  .memo-text { font-size:14px; margin-bottom:6px; color:#ccc; }
  .lap-row { font-size:16px; margin:4px 0; }
  .summary {
    margin-top:8px;
    padding-top:6px;
    border-top:1px dashed #444;
    font-size:14px;
  }
  .bottom-bar {
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    background:#111;
    border-top:1px solid #333;
    padding:8px 4px;
    display:flex;
    gap:4px;
    box-sizing:border-box;
  }
  .bottom-bar button {
    flex:1;
    padding:10px 0;
    font-size:16px;
    border:none;
    border-radius:6px;
    color:#fff;
  }
  #backBtn { background:#17a2b8; }
  #csvBtn { background:#fd7e14; }
</style>
</head>
<body>

<h2>セクション一覧</h2>
<div id="sections"></div>

<div class="bottom-bar">
  <button id="backBtn" onclick="location.href='index.html'">戻る</button>
  <button id="csvBtn" onclick="downloadCSV()">CSV</button>
</div>

<script>
let savedSections = JSON.parse(localStorage.getItem("saved_sections_v1") || "[]");

function toMS(t){
  const [m,s]=t.split(":");
  const [sec,ms]=s.split(".");
  return Number(m)*60000+Number(sec)*1000+Number(ms)*10;
}
function fromMS(ms){
  const m=Math.floor(ms/60000);
  const s=Math.floor((ms%60000)/1000);
  const ms2=Math.floor((ms%1000)/10);
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(ms2).padStart(2,"0")}`;
}

function buildPersonLapData(sec){
  const data={};
  sec.laps.forEach((lap,idx)=>{
    if(!lap.name) return;
    if(!data[lap.name]) data[lap.name]=[];
    data[lap.name].push({ index:idx, time:lap.time });
  });
  return data;
}

function render(){
  const container=document.getElementById("sections");
  container.innerHTML="";

  savedSections.forEach((sec,idx)=>{
    const box=document.createElement("div");
    box.className="section";

    let html=`
      <h3 class="section-title">セクション ${idx+1}（${sec.date}）</h3>
      <div class="memo-text">メモ：${sec.memo}</div>
    `;

    const lapCounts={};
    sec.laps.forEach((lap,li)=>{
      let lapCount="";
      if(lap.name){
        if(!lapCounts[lap.name]) lapCounts[lap.name]=0;
        lapCounts[lap.name]++;
        lapCount=lapCounts[lap.name];
      }
      html+=`
        <div class="lap-row">
          LAP${li+1} ${lap.time} (+${lap.diff})
          ${lap.name ? `　${lap.name} 周回${lapCount}` : ""}
        </div>
      `;
    });

    const personData=buildPersonLapData(sec);
    const persons=Object.keys(personData);

    if(persons.length>0){
      html+=`<div class="summary">`;
      persons.forEach(name=>{
        const laps=personData[name];
        html+=`<div><strong>${name}</strong><br>`;
        laps.forEach((lp,i)=>{
          let lapTime;
          if(i===0) lapTime=lp.time;
          else lapTime=fromMS(toMS(laps[i].time)-toMS(laps[i-1].time));
          html+=`　周回${i+1}: ${lapTime}<br>`;
        });
        html+=`</div>`;
      });
      html+=`</div>`;
    }

    box.innerHTML=html;
    container.appendChild(box);
  });
}
