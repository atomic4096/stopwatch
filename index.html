<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Section Stopwatch</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<style>
  body {
    background:#000;
    color:#fff;
    font-family:sans-serif;
    margin:0;
    padding-top:90px;
    padding-bottom:120px;
  }

  #time {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:#111;
    border-bottom:1px solid #333;
    font-size:48px;
    text-align:center;
    padding:12px 0;
    z-index:10;
  }

  /* スタート音ボタン（右端） */
  #soundBtn, #soundStopBtn {
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:36px;
    height:36px;
    background:#333;
    border:none;
    border-radius:50%;
    font-size:18px;
    color:#fff;
    touch-action:manipulation;
  }
  #soundBtn { right:56px; }
  #soundStopBtn { right:10px; }

  #soundBtn:active, #soundStopBtn:active {
    transform:translateY(-50%) scale(0.85);
  }

  #sections { padding:8px; }

  .section {
    background:#111;
    border:1px solid #333;
    border-radius:8px;
    padding:10px;
    margin-bottom:10px;
  }

  .section-title {
    font-size:16px;
    margin:0 0 6px 0;
    position:relative;
  }

  /* 丸背景の削除ボタン */
  .delBtn {
    position:absolute;
    right:0;
    top:0;
    width:32px;
    height:32px;
    background:#550000;
    border:none;
    border-radius:50%;
    font-size:18px;
    color:#ff7777;
    display:flex;
    justify-content:center;
    align-items:center;
    touch-action:manipulation;
  }
  .delBtn:active {
    transform:scale(0.85);
  }

  .lap-row { font-size:16px; margin:4px 0; }

  select {
    font-size:14px;
    padding:2px 4px;
    margin-left:6px;
  }

  .bottom-bar {
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    background:#111;
    border-top:1px solid #333;
    padding:8px 4px;
    display:flex;
    gap:4px;
    box-sizing:border-box;
  }
  .bottom-bar button {
    flex:1;
    padding:18px 0;
    font-size:20px;
    border:none;
    border-radius:10px;
    color:#fff;
    touch-action:manipulation; /* ← ダブルタップズーム防止 */
  }
  #mainBtn { background:#28a745; }
  #lapBtn { background:#007bff; }
  #nameBtn { background:#17a2b8; }
  #secBtn { background:#6610f2; }

  /* モーダル */
  .modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 20;
  }

  .modal-content {
    background: #222;
    padding: 20px;
    border-radius: 10px;
    width: 90%;
    max-width: 350px;
    color: #fff;
    text-align: center;
  }

  .modal-content button {
    margin: 4px;
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    background: #444;
    color: #fff;
  }

  .selected-btn {
    background:#1e90ff !important;
  }
</style>
</head>
<body>

<div id="time">
  00:00.00
  <button id="soundBtn" onclick="playStartSound()">🔊</button>
  <button id="soundStopBtn" onclick="stopStartSound()">⏹</button>
</div>

<div id="sections"></div>

<div class="bottom-bar">
  <button id="mainBtn" onclick="vibrateShort(); playClick(); toggleStartStop()">Start</button>
  <button id="lapBtn" onclick="vibrateShort(); playClick(); addLap()" disabled>Lap</button>
  <button id="nameBtn" onclick="location.href='names.html'">名前</button>
  <button id="secBtn" onclick="location.href='sections.html'">セクション</button>
</div>

<!-- 入力モーダル -->
<div id="inputModal" class="modal">
  <div class="modal-content">
    <h3>入力</h3>

    <!-- 天気 -->
    <div>
      <strong>天気</strong><br>
      <button class="weather-btn" onclick="selectWeather('晴れ', event)">晴れ</button>
      <button class="weather-btn" onclick="selectWeather('曇り', event)">曇り</button>
      <button class="weather-btn" onclick="selectWeather('雨', event)">雨</button>
    </div>

    <!-- 風 -->
    <div style="margin-top:10px;">
      <strong>風</strong><br>
      <button class="wind-btn" onclick="selectWind('無風', event)">無風</button>
      <button class="wind-btn" onclick="selectWind('弱風', event)">弱風</button>
      <button class="wind-btn" onclick="selectWind('中風', event)">中風</button>
      <button class="wind-btn" onclick="selectWind('強風', event)">強風</button>
    </div>

    <!-- 種目 -->
    <div style="margin-top:10px;">
      <strong>種目</strong><br>
      <button class="practice-btn" onclick="selectPractice('100m', event)">100m</button>
      <button class="practice-btn" onclick="selectPractice('400m', event)">400m</button>
      <button class="practice-btn" onclick="selectPractice('片足', event)">片足</button>
      <button class="practice-btn" onclick="selectPractice('タイヤ', event)">タイヤ</button>
      <button class="practice-btn" onclick="selectPractice('リレー', event)">リレー</button>
    </div>

    <!-- メモ -->
    <div style="margin-top:10px;">
      <strong>メモ</strong><br>
      <input id="memoInput" type="text" placeholder="メモ（空欄可）">
    </div>

    <button style="margin-top:15px;" onclick="finishInput()">保存</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
/* ===== スタート音（あなたの MP3） ===== */
const START_SOUND_URL = "https://github.com/atomic4096/stopwatch/raw/refs/heads/main/start-sound.mp3";

/* ===== 遅延ゼロのためのプリロード（スタート音） ===== */
let startSound = new Audio(START_SOUND_URL);
startSound.load();

/* ===== iPhone の初回タップで音を解禁 ===== */
document.addEventListener("touchstart", () => {
  startSound.play().then(() => {
    startSound.pause();
    startSound.currentTime = 0;
  });
}, { once: true });

/* ===== スタート音再生 ===== */
function playStartSound(){
  startSound.pause();
  startSound.currentTime = 0;
  startSound.play();
}

/* ===== スタート音停止 ===== */
function stopStartSound(){
  startSound.pause();
  startSound.currentTime = 0;
}

/* ===== ピッ音（Start / Lap / Stop 用） ===== */
let clickSound = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
clickSound.load();

function playClick(){
  clickSound.pause();
  clickSound.currentTime = 0;
  clickSound.play();
}

/* ===== バイブ ===== */
function vibrateShort(){
  if (navigator.vibrate) navigator.vibrate(50);
}

/* ===== Firebase ===== */
const firebaseConfig = {
  apiKey: "AIzaSyC7g7RRw3LxO7fBQJghrm2hvxkwcYPT55k",
  authDomain: "stopwatch-app-21e5f.firebaseapp.com",
  projectId: "stopwatch-app-21e5f",
  storageBucket: "stopwatch-app-21e5f.firebasestorage.app",
  messagingSenderId: "326918590564",
  appId: "1:326918590564:web:de3f433f71994d0a698f71"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ===== 名前リスト ===== */
let names = [];
db.collection("names").doc("shared").onSnapshot(doc=>{
  if(doc.exists) names = doc.data().list;
});

/* ===== ローカル ===== */
let sections = JSON.parse(localStorage.getItem("sections_local_v1") || "[]");

/* 未完了セクション自動削除 */
sections = sections.filter(sec => sec.laps.length > 0);
saveLocal();

/* ===== 時刻変換 ===== */
function toMS(t){
  const [m,s]=t.split(":");
  const [sec,ms]=s.split(".");
  return Number(m)*60000+Number(sec)*1000+Number(ms)*10;
}
function fromMS(ms){
  const m=Math.floor(ms/60000);
  const s=Math.floor((ms%60000)/1000);
  const ms2=Math.floor((ms%1000)/10);
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(ms2).padStart(2,"0")}`;
}
function todayStr(){
  const d=new Date();
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
}

/* ===== タイマー ===== */
let timer=null;
let startTime=0;
let currentSectionIndex=null;

function updateDisplay(ms){
  document.getElementById("time").textContent=fromMS(ms);
}
function tick(){
  updateDisplay(Date.now()-startTime);
}

/* ===== Start / Stop ===== */
async function toggleStartStop(){
  const btn=document.getElementById("mainBtn");
  const lapBtn=document.getElementById("lapBtn");

  if(timer){
    clearInterval(timer);
    timer=null;
    btn.textContent="Start";
    btn.style.background="#28a745";
    lapBtn.disabled = true;

    if(currentSectionIndex !== null){
      addLap();
    }

    openInputModal();

  } else {
    startTime=Date.now();
    updateDisplay(0);
    timer=setInterval(tick,10);
    btn.textContent="Stop";
    btn.style.background="#dc3545";
    lapBtn.disabled = false;

    startNewSection();
  }
}

/* ===== 新しいセクション ===== */
function startNewSection(){
  const sec={
    date: todayStr(),
    weather:"",
    wind:"",
    practice:"",
    memo:"",
    laps:[]
  };
  sections.push(sec);
  currentSectionIndex=sections.length-1;
  saveLocal();
  render();
}

/* ===== Lap ===== */
function addLap(){
  if(currentSectionIndex===null) return;
  const sec=sections[currentSectionIndex];
  const nowStr=document.getElementById("time").textContent;
  let diff=nowStr;
  if(sec.laps.length>0){
    diff=fromMS(toMS(nowStr)-toMS(sec.laps[sec.laps.length-1].time));
  }
  sec.laps.push({ time:nowStr, diff:diff, nameId:"" });
  saveLocal();
  render();
}

/* ===== 名前変更 ===== */
function changeName(sectionIndex, lapIndex, newId){
  sections[sectionIndex].laps[lapIndex].nameId = newId;
  saveLocal();
  render();
}

/* ===== モーダル入力 ===== */
let inputWeather = "";
let inputWind = "";
let inputPractice = "";

function openInputModal() {
  inputWeather = "";
  inputWind = "";
  inputPractice = "";
  document.getElementById("memoInput").value = "";

  document.querySelectorAll(".weather-btn").forEach(btn => btn.classList.remove("selected-btn"));
  document.querySelectorAll(".wind-btn").forEach(btn => btn.classList.remove("selected-btn"));
  document.querySelectorAll(".practice-btn").forEach(btn => btn.classList.remove("selected-btn"));

  document.getElementById("inputModal").style.display = "flex";
}

function selectWeather(w, e) {
  inputWeather = w;
  document.querySelectorAll(".weather-btn").forEach(btn => btn.classList.remove("selected-btn"));
  e.target.classList.add("selected-btn");
}

function selectWind(w, e) {
  inputWind = w;
  document.querySelectorAll(".wind-btn").forEach(btn => btn.classList.remove("selected-btn"));
  e.target.classList.add("selected-btn");
}

function selectPractice(p, e) {
  inputPractice = p;
  document.querySelectorAll(".practice-btn").forEach(btn => btn.classList.remove("selected-btn"));
  e.target.classList.add("selected-btn");
}

async function finishInput() {
  const memo = document.getElementById("memoInput").value || "";

  sections[currentSectionIndex].weather = inputWeather;
  sections[currentSectionIndex].wind = inputWind;
  sections[currentSectionIndex].practice = inputPractice;
  sections[currentSectionIndex].memo = memo;

  await saveSectionToFirestore(currentSectionIndex, {
    weather: inputWeather,
    wind: inputWind,
    practice: inputPractice,
    memo: memo
  });

  sections.splice(currentSectionIndex, 1);
  currentSectionIndex = null;
  saveLocal();
  render();

  document.getElementById("inputModal").style.display = "none";
}

/* ===== Firestore 保存 ===== */
async function saveSectionToFirestore(si, extra){
  const sec = sections[si];

  await db.collection("sections").add({
    timestamp: Date.now(),
    date: sec.date,
    weather: extra.weather || "",
    wind: extra.wind || "",
    practice: extra.practice || "",
    memo: extra.memo || "",
    laps: sec.laps.map(l => ({
      time: l.time,
      diff: l.diff,
      nameId: l.nameId || ""
    }))
  });
}

/* ===== ローカル保存 ===== */
function saveLocal(){
  localStorage.setItem("sections_local_v1",JSON.stringify(sections));
}

/* ===== セクション削除 ===== */
function deleteLocalSection(index, e){
  e.preventDefault();
  e.stopPropagation();

  if(!confirm("このセクションを削除しますか？")) return;

  sections.splice(index, 1);
  saveLocal();
  render();
}

/* ===== 描画 ===== */
function render(){
  const container=document.getElementById("sections");
  container.innerHTML="";

  sections.forEach((sec,si)=>{
    const box=document.createElement("div");
    box.className="section";

    let html=`
      <h3 class="section-title">
        セクション ${si+1}（${sec.date}）
        <button class="delBtn" onclick="deleteLocalSection(${si}, event)">🗑️</button>
      </h3>
    `;

    const lapCounts={};
    sec.laps.forEach((lap,li)=>{
      const nameObj = names.find(n => n.id === lap.nameId);
      const displayName = nameObj ? nameObj.name : "";

      let lapCount="";
      if(displayName){
        if(!lapCounts[displayName]) lapCounts[displayName]=0;
        lapCounts[displayName]++;
        lapCount=lapCounts[displayName];
      }

      html+=`
        <div class="lap-row">
          LAP${li+1} ${lap.time} (+${lap.diff})
          <select onchange="changeName(${si},${li},this.value)">
            <option value="">未設定</option>
            ${names.map(n=>`<option value="${n.id}" ${lap.nameId===n.id?"selected":""}>${n.name}</option>`).join("")}
          </select>
          ${displayName ? `　${displayName} 周回${lapCount}` : ""}
        </div>
      `;
    });

    box.innerHTML=html;
    container.appendChild(box);
  });
}

render();
</script>

</body>
</html>
