<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>名前管理</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    background:#000;
    color:#fff;
    font-family:sans-serif;
    margin:20px;
    text-align:center;
  }
  .card {
    background:#111;
    border:1px solid #333;
    border-radius:8px;
    padding:6px;
    margin:6px 0;
    font-size:14px;
  }
  input {
    width:80%;
    font-size:16px;
    padding:6px;
    margin-bottom:8px;
  }
  button {
    font-size:14px;
    padding:8px 16px;
    border:none;
    border-radius:6px;
    color:#fff;
    margin:4px;
  }
  #addBtn { background:#28a745; }
  .delBtn { background:#dc3545; }
  #backBtn { background:#17a2b8; }
</style>
</head>
<body>

<h2>名前管理</h2>

<input id="nameInput" type="text" placeholder="名前を入力">
<button id="addBtn" onclick="addName()">追加</button>

<div id="list"></div>

<button id="backBtn" onclick="location.href='index.html'">戻る</button>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
// あなたの Firebase 設定
const firebaseConfig = {
  apiKey: "AIzaSyC7g7RRw3LxO7fBQJghrm2hvxkwcYPT55k",
  authDomain: "stopwatch-app-21e5f.firebaseapp.com",
  projectId: "stopwatch-app-21e5f",
  storageBucket: "stopwatch-app-21e5f.firebasestorage.app",
  messagingSenderId: "326918590564",
  appId: "1:326918590564:web:de3f433f71994d0a698f71"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let names = [];

// Firestore からリアルタイム取得
db.collection("names").doc("shared").onSnapshot(doc => {
  if (doc.exists) {
    names = doc.data().list;
  } else {
    names = [];
  }
  render();
});

// Firestore に保存
function save() {
  db.collection("names").doc("shared").set({ list: names });
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  names.forEach(n => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      ${n}
      <button class="delBtn" onclick="delName('${n}')">削除</button>
    `;
    list.appendChild(div);
  });
}

function addName() {
  const input = document.getElementById("nameInput");
  const v = input.value.trim();
  if (!v) return;
  if (!names.includes(v)) names.push(v);
  input.value = "";
  save();
}

function delName(name) {
  names = names.filter(n => n !== name);
  save();
}
</script>

</body>
</html>
