<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>名前管理</title>
</head>
<body>

<h2>名前管理</h2>

<input id="newName" placeholder="名前を入力">
<button onclick="addName()">追加</button>

<h3>名前一覧</h3>
<div id="nameList"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC7g7RRw3LxO7fBQJghrm2hvxkwcYPT55k",
  authDomain: "stopwatch-app-21e5f.firebaseapp.com",
  projectId: "stopwatch-app-21e5f",
  storageBucket: "stopwatch-app-21e5f.firebasestorage.app",
  messagingSenderId: "326918590564",
  appId: "1:326918590564:web:de3f433f71994d0a698f71"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let names = [];

db.collection("names").doc("shared").onSnapshot(doc => {
  if (doc.exists) names = doc.data().list;
  renderNames();
});

function addName() {
  const name = document.getElementById("newName").value.trim();
  if (!name) return;
  names.push(name);
  db.collection("names").doc("shared").set({ list: names });
  document.getElementById("newName").value = "";
}

function deleteName(n) {
  names = names.filter(x => x !== n);
  db.collection("names").doc("shared").set({ list: names });
}

function renderNames() {
  const container = document.getElementById("nameList");
  container.innerHTML = "";
  names.forEach(n => {
    const div = document.createElement("div");
    div.innerHTML = `${n} <button onclick="deleteName('${n}')">削除</button>`;
    container.appendChild(div);
  });
}
</script>

</body>
</html>
