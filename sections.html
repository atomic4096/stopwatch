<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>セクション一覧</title>
<style>
  .section { border: 1px solid #ccc; margin: 10px 0; padding: 10px; }
  .header { font-weight: bold; cursor: pointer; }
  .body { display: none; margin-top: 10px; }
</style>
</head>
<body>

<h2>セクション一覧</h2>
<div id="sections"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC7g7RRw3LxO7fBQJghrm2hvxkwcYPT55k",
  authDomain: "stopwatch-app-21e5f.firebaseapp.com",
  projectId: "stopwatch-app-21e5f",
  storageBucket: "stopwatch-app-21e5f.firebasestorage.app",
  messagingSenderId: "326918590564",
  appId: "1:326918590564:web:de3f433f71994d0a698f71"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let names = [];

// 名前リスト同期
db.collection("names").doc("shared").onSnapshot(doc => {
  if (doc.exists) names = doc.data().list;
});

// セクション一覧
db.collection("sections")
  .orderBy("timestamp", "desc")
  .onSnapshot(snapshot => {
    const list = [];
    snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
    renderSections(list);
  });

function formatDate(ts) {
  const d = new Date(ts);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  const h = String(d.getHours()).padStart(2, "0");
  const min = String(d.getMinutes()).padStart(2, "0");
  return `${y}/${m}/${day} ${h}:${min}`;
}

function formatTime(ms) {
  const t = ms / 1000;
  const m = Math.floor(t / 60);
  const s = (t % 60).toFixed(2).padStart(5, "0");
  return `${String(m).padStart(2, "0")}:${s}`;
}

function renderSections(list) {
  const container = document.getElementById("sections");
  container.innerHTML = "";

  list.forEach(sec => {
    const div = document.createElement("div");
    div.className = "section";

    // 周回数集計
    const counts = {};
    Object.entries(sec.names || {}).forEach(([i, name]) => {
      if (!counts[name]) counts[name] = 0;
      counts[name]++;
    });

    const countText = Object.entries(counts)
      .map(([name, c]) => `${name}${c}周`)
      .join(" / ") || "周回なし";

    const header = document.createElement("div");
    header.className = "header";
    header.textContent =
      `${sec.memo}（${formatDate(sec.timestamp)}｜${formatTime(sec.laps.reduce((a,b)=>a+b,0))}｜${countText}）`;

    const body = document.createElement("div");
    body.className = "body";

    sec.laps.forEach((lap, i) => {
      const p = document.createElement("div");
      const select = document.createElement("select");

      select.innerHTML = `<option value="">未割り当て</option>` +
        names.map(n => `<option value="${n}">${n}</option>`).join("");

      if (sec.names && sec.names[i]) select.value = sec.names[i];

      select.onchange = () => {
        db.collection("sections").doc(sec.id).update({
          [`names.${i}`]: select.value
        });
      };

      p.textContent = `${i + 1}：${formatTime(lap)} `;
      p.appendChild(select);
      body.appendChild(p);
    });

    const del = document.createElement("button");
    del.textContent = "削除";
    del.onclick = () => {
      if (confirm("削除しますか？")) {
        db.collection("sections").doc(sec.id).delete();
      }
    };
    body.appendChild(del);

    header.onclick = () => {
      body.style.display = body.style.display === "none" ? "block" : "none";
    };

    div.appendChild(header);
    div.appendChild(body);
    container.appendChild(div);
  });
}
</script>

</body>
</html>
