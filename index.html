<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Section Stopwatch</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    background:#000;
    color:#fff;
    font-family:sans-serif;
    margin:0;
    padding-top:90px;
    padding-bottom:120px;
  }

  #time {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:#111;
    border-bottom:1px solid #333;
    font-size:48px;
    text-align:center;
    padding:12px 0;
    z-index:10;
  }

  #sections { padding:8px; }

  .section {
    background:#111;
    border:1px solid #333;
    border-radius:8px;
    padding:10px;
    margin-bottom:10px;
  }

  .section-title {
    font-size:16px;
    margin:0 0 6px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .lap-row { font-size:16px; margin:4px 0; }

  select {
    font-size:14px;
    padding:2px 4px;
    margin-left:6px;
  }

  .bottom-bar {
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    background:#111;
    border-top:1px solid #333;
    padding:8px 4px;
    display:flex;
    gap:4px;
    box-sizing:border-box;
  }
 .bottom-bar button {
    flex:1;
    padding:18px 0;
    font-size:20px;
    border:none;
    border-radius:10px;
    color:#fff;
}
  #mainBtn { background:#28a745; }
  #lapBtn { background:#007bff; }
  #nameBtn { background:#17a2b8; }
  #secBtn { background:#6610f2; }

  /* モーダル */
  .modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 20;
  }

  .modal-content {
    background: #222;
    padding: 20px;
    border-radius: 10px;
    width: 90%;
    max-width: 350px;
    color: #fff;
    text-align: center;
  }

  .modal-content button {
    margin: 4px;
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    background: #444;
    color: #fff;
  }
</style>
</head>
<body>

<div id="time">00:00.00</div>
<div id="sections"></div>

<div class="bottom-bar">
  <button id="mainBtn" onclick="toggleStartStop()">Start</button>
  <button id="lapBtn" onclick="addLap()" disabled>Lap</button>
  <button id="nameBtn" onclick="location.href='names.html'">名前</button>
  <button id="secBtn" onclick="location.href='sections.html'">セクション</button>
</div>

<!-- 入力モーダル -->
<div id="inputModal" class="modal">
  <div class="modal-content">
    <h3>入力</h3>

    <div>
      <strong>天気</strong><br>
      <button onclick="selectWeather('晴れ')">晴れ</button>
      <button onclick="selectWeather('曇り')">曇り</button>
      <button onclick="selectWeather('雨')">雨</button>
      <button onclick="selectWeather('風強め')">風強め</button>
      <button onclick="selectWeather('無風')">無風</button>
    </div>

    <div style="margin-top:10px;">
      <strong>種目</strong><br>
      <button onclick="selectPractice('100m')">100m</button>
      <button onclick="selectPractice('400m')">400m</button>
      <button onclick="selectPractice('片足')">片足</button>
      <button onclick="selectPractice('タイヤ')">タイヤ</button>
      <button onclick="selectPractice('リレー')">リレー</button>
    </div>

    <div style="margin-top:10px;">
      <strong>メモ</strong><br>
      <input id="memoInput" type="text" placeholder="メモ（空欄可）">
    </div>

    <button style="margin-top:15px;" onclick="finishInput()">保存</button>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
// Firebase 設定
const firebaseConfig = {
  apiKey: "AIzaSyC7g7RRw3LxO7fBQJghrm2hvxkwcYPT55k",
  authDomain: "stopwatch-app-21e5f.firebaseapp.com",
  projectId: "stopwatch-app-21e5f",
  storageBucket: "stopwatch-app-21e5f.firebasestorage.app",
  messagingSenderId: "326918590564",
  appId: "1:326918590564:web:de3f433f71994d0a698f71"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ===== 時刻変換 ===== */
function toMS(t){
  const [m,s]=t.split(":");
  const [sec,ms]=s.split(".");
  return Number(m)*60000+Number(sec)*1000+Number(ms)*10;
}
function fromMS(ms){
  const m=Math.floor(ms/60000);
  const s=Math.floor((ms%60000)/1000);
  const ms2=Math.floor((ms%1000)/10);
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(ms2).padStart(2,"0")}`;
}
function todayStr(){
  const d=new Date();
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
}

/* ===== 名前リスト ===== */
let names = [];
db.collection("names").doc("shared").onSnapshot(doc=>{
  if(doc.exists) names = doc.data().list;
});

/* ===== ローカル ===== */
let sections = JSON.parse(localStorage.getItem("sections_local_v1") || "[]");

let timer=null;
let startTime=0;
let currentSectionIndex=null;

/* ===== タイマー ===== */
function updateDisplay(ms){
  document.getElementById("time").textContent=fromMS(ms);
}
function tick(){
  updateDisplay(Date.now()-startTime);
}

/* ===== Stop / Start ===== */
async function toggleStartStop(){
  const btn=document.getElementById("mainBtn");
  const lapBtn=document.getElementById("lapBtn");

  if(timer){
    clearInterval(timer);
    timer=null;
    btn.textContent="Start";
    btn.style.background="#28a745";
    lapBtn.disabled = true;

    if(currentSectionIndex !== null){
      addLap();
    }

    openInputModal();

  } else {
    startTime=Date.now();
    updateDisplay(0);
    timer=setInterval(tick,10);
    btn.textContent="Stop";
    btn.style.background="#dc3545";
    lapBtn.disabled = false;

    startNewSection();
  }
}

/* ===== 新しいセクション ===== */
function startNewSection(){
  const sec={
    date: todayStr(),
    weather:"",
    practice:"",
    memo:"",
    laps:[]
  };
  sections.push(sec);
  currentSectionIndex=sections.length-1;
  saveLocal();
  render();
}

/* ===== Lap ===== */
function addLap(){
  if(currentSectionIndex===null) return;
  const sec=sections[currentSectionIndex];
  const nowStr=document.getElementById("time").textContent;
  let diff=nowStr;
  if(sec.laps.length>0){
    diff=fromMS(toMS(nowStr)-toMS(sec.laps[sec.laps.length-1].time));
  }
  sec.laps.push({ time:nowStr, diff:diff, name:"" });
  saveLocal();
  render();
}

/* ===== モーダル入力 ===== */
let inputWeather = "";
let inputPractice = "";

function openInputModal() {
  inputWeather = "";
  inputPractice = "";
  document.getElementById("memoInput").value = "";
  document.getElementById("inputModal").style.display = "flex";
}

function selectWeather(w) {
  inputWeather = w;
}

function selectPractice(p) {
  inputPractice = p;
}

async function finishInput() {
  const memo = document.getElementById("memoInput").value || "";

  // ローカルにも保存
  sections[currentSectionIndex].weather = inputWeather;
  sections[currentSectionIndex].practice = inputPractice;
  sections[current[currentSectionIndex].memo = memo;

  await saveSectionToFirestore(currentSectionIndex, {
    weather: inputWeather,
    practice: inputPractice,
    memo: memo
  });

  sections.splice(currentSectionIndex, 1);
  currentSectionIndex = null;
  saveLocal();
  render();

  document.getElementById("inputModal").style.display = "none";
}

/* ===== Firestore 保存 ===== */
async function saveSectionToFirestore(si, extra){
  const sec = sections[si];

  await db.collection("sections").add({
    timestamp: Date.now(),
    date: sec.date,
    weather: extra.weather || "",
    practice: extra.practice || "",
    memo: extra.memo || "",
    laps: sec.laps.map(l => ({
      time: l.time,
      diff: l.diff,
      name: l.name || ""
    }))
  });
}

/* ===== ローカル保存 ===== */
function saveLocal(){
  localStorage.setItem("sections_local_v1",JSON.stringify(sections));
}

/* ===== 描画 ===== */
function render(){
  const container=document.getElementById("sections");
  container.innerHTML="";

  sections.forEach((sec,si)=>{
    const box=document.createElement("div");
    box.className="section";

    let html=`
      <h3 class="section-title">セクション ${si+1}（${sec.date}）</h3>
    `;

    const lapCounts={};
    sec.laps.forEach((lap,li)=>{
      let lapCount="";
      if(lap.name){
        if(!lapCounts[lap.name]) lapCounts[lap.name]=0;
        lapCounts[lap.name]++;
        lapCount=lapCounts[lap.name];
      }
      html+=`
        <div class="lap-row">
          LAP${li+1} ${lap.time} (+${lap.diff})
          <select onchange="changeName(${si},${li},this.value)">
            <option value="">未設定</option>
            ${names.map(n=>`<option value="${n}" ${lap.name===n?"selected":""}>${n}</option>`).join("")}
          </select>
          ${lap.name ? `　${lap.name} 周回${lapCount}` : ""}
        </div>
      `;
    });

    box.innerHTML=html;
    container.appendChild(box);
  });
}

render();
</script>

</body>
</html>
